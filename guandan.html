<meta charset="utf-8">
<title>掼蛋牌桌助手</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Noto+Sans+SC:wght@400;500;700&family=ZCOOL+XiaoWei&display=swap">

<style>
:root{
  --bg:#E7EAE5; --surface:#F8F9F6; --surface-2:#DBE0D8;
  --line:#C5CCC1; --line-soft:#D7DCD3;
  --text:#1A211D; --muted:#5F6A63; --faint:#8B958D;
  --red:#A93226; --red-soft:#F0DEDB;
  --jade:#1D6B58; --jade-soft:#D7E5E0;
  --gold:#8E6B18; --gold-soft:#EDE3C9;
  --face:#FBFAF6; --face-line:#D8D6CC;
  --card-red:#B3352A; --card-jade:#1A6551;   /* 白牌面上的字，固定不随主题变 */
  --shadow:0 1px 2px rgba(26,33,29,.07), 0 10px 26px -14px rgba(26,33,29,.30);
  --radius:10px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#101413; --surface:#191F1D; --surface-2:#242C29;
    --line:#333D39; --line-soft:#28312E;
    --text:#E7EDE9; --muted:#98A49D; --faint:#6B7972;
    --red:#E4655A; --red-soft:#38211F;
    --jade:#42B394; --jade-soft:#16302A;
    --gold:#D6A94A; --gold-soft:#332A15;
    --shadow:0 1px 2px rgba(0,0,0,.45), 0 12px 30px -16px rgba(0,0,0,.8);
  }
}
:root[data-theme="dark"]{
  --bg:#101413; --surface:#191F1D; --surface-2:#242C29;
  --line:#333D39; --line-soft:#28312E;
  --text:#E7EDE9; --muted:#98A49D; --faint:#6B7972;
  --red:#E4655A; --red-soft:#38211F;
  --jade:#42B394; --jade-soft:#16302A;
  --gold:#D6A94A; --gold-soft:#332A15;
  --shadow:0 1px 2px rgba(0,0,0,.45), 0 12px 30px -16px rgba(0,0,0,.8);
}

*{box-sizing:border-box}
[hidden]{display:none!important}   /* 否则会被 .seg/.card 的 display 规则盖掉 */
body{margin:0;background:var(--bg);color:var(--text);
  font-family:"Noto Sans SC","PingFang SC","Hiragino Sans GB",system-ui,sans-serif;
  font-size:15px;line-height:1.6;-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
.mono{font-family:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit;background:none;border:none;padding:0;cursor:pointer}
:focus-visible{outline:2px solid var(--red);outline-offset:2px;border-radius:4px}
.shell{max-width:560px;margin:0 auto;padding:0 14px 64px}

.top{position:sticky;top:0;z-index:20;background:var(--bg);
  background:color-mix(in srgb, var(--bg) 88%, transparent);
  backdrop-filter:blur(12px);border-bottom:1px solid var(--line-soft);margin:0 -14px;padding:10px 14px 0}
.brandrow{display:flex;align-items:center;gap:10px}
.brand{font-family:"ZCOOL XiaoWei","Noto Sans SC",serif;font-size:21px;letter-spacing:.06em;line-height:1}
.brand .dot{color:var(--red)}
.brand-sub{font-size:11px;color:var(--faint);letter-spacing:.14em;margin-left:2px}
.lvlchip{margin-left:auto;display:flex;align-items:center;gap:7px;border:1px solid var(--gold);
  background:var(--gold-soft);border-radius:999px;padding:4px 12px 4px 10px}
.lvlchip .lab{font-size:11px;color:var(--gold);letter-spacing:.1em}
.lvlchip .val{font-family:"IBM Plex Mono",monospace;font-weight:600;font-size:17px;color:var(--gold);line-height:1}
.lvlpick{display:none;gap:5px;overflow-x:auto;padding:10px 0 2px;scrollbar-width:none}
.lvlpick::-webkit-scrollbar{display:none}
.lvlpick.open{display:flex}
.lvlpick button{flex:0 0 auto;min-width:34px;padding:5px 0;text-align:center;border:1px solid var(--line);
  border-radius:7px;background:var(--surface);font-family:"IBM Plex Mono",monospace;font-size:14px;color:var(--muted)}
.lvlpick button[aria-pressed="true"]{background:var(--gold);border-color:var(--gold);color:var(--surface);font-weight:600}

.panel{display:none;padding-top:16px}
.panel.on{display:block}
.card{background:var(--surface);border:1px solid var(--line-soft);border-radius:var(--radius);
  padding:14px;margin-bottom:12px;box-shadow:var(--shadow)}
.card > h3{margin:0 0 10px;font-size:11px;font-weight:500;letter-spacing:.16em;color:var(--faint);text-transform:uppercase}
h2.sec{font-family:"ZCOOL XiaoWei","Noto Sans SC",serif;font-size:17px;font-weight:400;letter-spacing:.04em;
  margin:20px 0 10px;display:flex;align-items:baseline;gap:8px}
h2.sec::after{content:"";flex:1;height:1px;background:var(--line-soft)}
p.note{margin:8px 0 0;font-size:12.5px;color:var(--muted);line-height:1.65}

.seg{display:flex;background:var(--surface-2);border-radius:9px;padding:3px;gap:3px}
.seg button{flex:1;padding:8px 4px;text-align:center;font-size:13px;color:var(--muted);border-radius:7px;line-height:1.3}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--text);font-weight:500;box-shadow:0 1px 3px rgba(0,0,0,.12)}
.seg.red button[aria-pressed="true"]{color:var(--red)}
.seg.s4 button{font-size:12.5px;padding:8px 2px}
.seg.s4 button[data-a],.seg.s4 button[data-d]{font-size:12px}

/* 说明收进一个 ⓘ，点开才展开，平时不占地方 */
.hint{width:18px;height:18px;border-radius:50%;border:1px solid var(--line);color:var(--faint);
  font-size:11px;line-height:16px;text-align:center;flex:0 0 auto;margin-left:7px;
  font-family:"IBM Plex Mono",monospace}
.hint.on{border-color:var(--gold);color:var(--gold);background:var(--gold-soft)}
.hint.float{position:absolute;top:12px;right:12px;margin:0}
.tiny{text-align:center;margin:14px 0 4px}
.tiny button{font-size:12px;color:var(--faint);letter-spacing:.04em;padding:6px 10px;
  border-bottom:1px dotted var(--line)}
.tiny button:hover,.tiny button:focus-visible{color:var(--muted)}
.card{position:relative}
.card > h3{display:flex;align-items:center}

/* 手机横屏：往桌上一放当记分牌用，只留两张大牌
   加 max-height 是为了避开电脑浏览器 —— 桌面窗口也是"横屏"，但没这么矮 */
@media (orientation: landscape) and (max-height: 560px){
  :root[data-view="score"] .top,
  :root[data-view="score"] #p-score > *{display:none}
  :root[data-view="score"] #p-score > #teamsCard{
    display:block;height:100dvh;margin:0;padding:0;
    background:transparent;border:none;box-shadow:none}
  :root[data-view="score"] .shell{padding:0;max-width:none}
  :root[data-view="score"] .panel{padding-top:0}
  :root[data-view="score"] .teams{height:100dvh;align-items:center;gap:clamp(12px,4vw,40px);padding:0 14px}
  :root[data-view="score"] .team{background:transparent;border:none;box-shadow:none;padding:0}
  :root[data-view="score"] .team input{font-size:15px}
  :root[data-view="score"] .pcard{height:74dvh;width:auto;margin:8px auto 0}
  :root[data-view="score"] .pcard .big{font-size:min(23dvh,150px)}
  :root[data-view="score"] .pcard .corner .rk{font-size:min(6dvh,38px)}
  :root[data-view="score"] .pcard .corner .su{font-size:min(5dvh,32px)}
  /* 徽章会压住队名；隔着桌子看，给牌镶一圈金边比小徽章清楚得多 */
  :root[data-view="score"] .crown{display:none}
  :root[data-view="score"] .team.act .pcard{
    box-shadow:0 0 0 3px var(--gold), 0 2px 6px rgba(0,0,0,.3), 0 14px 30px -14px rgba(0,0,0,.6)}
  :root[data-view="score"] .team input{font-size:clamp(15px,4.2dvh,22px);color:var(--text)}
  :root[data-view="score"] .team.act input{color:var(--gold);font-weight:500}
  :root[data-view="score"] .tries{margin-top:8px;height:10px}
  :root[data-view="score"] .tries i{width:9px;height:9px}
}

/* 进贡 */
.trib{display:flex;flex-direction:column;gap:10px}
.flow{display:flex;align-items:center;gap:9px;padding:11px 12px;border-radius:9px;
  background:var(--surface-2);border:1px solid var(--line-soft);flex-wrap:wrap}
.flow.me{border-color:var(--jade);background:var(--jade-soft)}
.flow .who{font-weight:600;font-size:15px}
.flow .arrow{color:var(--faint);font-family:"IBM Plex Mono",monospace}
.flow .what{margin-left:auto;font-size:12.5px;color:var(--muted);flex:0 0 auto}
.trow{display:flex;gap:9px;align-items:baseline;font-size:13px;padding:2px 0}
.trow .lab{flex:0 0 42px;font-size:11px;letter-spacing:.1em;color:var(--faint)}
.trow b{font-weight:500}
.gift{display:flex;gap:6px;flex-wrap:wrap;margin-top:2px}
.gift button{border:1px solid var(--line);border-radius:7px;padding:5px 11px;font-size:13px;
  background:var(--surface);font-family:"IBM Plex Mono",monospace}
.gift button.on{border-color:var(--jade);background:var(--jade-soft);color:var(--jade);font-weight:600}

.btn{border:1px solid var(--line);border-radius:8px;padding:8px 14px;background:var(--surface);font-size:13.5px;color:var(--text)}
.btn:active{transform:translateY(1px)}
.btn:disabled{opacity:.4}
.btn.ghost{background:transparent;color:var(--muted)}
.btn.solid{background:var(--red);border-color:var(--red);color:#fff}
.btn.jade{background:var(--jade);border-color:var(--jade);color:#fff}
.btn.gold{background:var(--gold);border-color:var(--gold);color:var(--surface)}
.btn.wide{width:100%;text-align:center}
.btnrow{display:flex;gap:8px;flex-wrap:wrap}

/* 座位条 */
.seats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.seat{border:1px solid var(--line-soft);border-radius:9px;padding:7px 4px 6px;text-align:center;
  background:var(--surface-2);display:flex;flex-direction:column;align-items:center;gap:1px}
.seat > span{display:block}
.seat .nm{font-size:11.5px;color:var(--muted);line-height:1.3}
.seat .lf{font-family:"IBM Plex Mono",monospace;font-size:20px;font-weight:500;line-height:1.2}
.seat .st{font-size:9.5px;letter-spacing:.06em;color:var(--faint);height:12px;line-height:1.2}
.seat.me{border-color:var(--jade)}
.seat.me .lf{color:var(--jade)}
.seat.turn{background:var(--gold-soft);border-color:var(--gold);box-shadow:inset 0 0 0 1px var(--gold)}
.seat.turn .nm,.seat.turn .st{color:var(--gold)}
.seat.done{opacity:.45}
.seat .top-mark{color:var(--red);font-weight:600}

.table-now{display:flex;align-items:center;gap:8px;margin-top:10px;padding:9px 11px;border-radius:8px;
  background:var(--surface-2);border:1px solid var(--line-soft);font-size:13px}
.table-now .k{font-size:11px;color:var(--faint);letter-spacing:.1em;flex:0 0 auto}
.table-now .v{font-family:"IBM Plex Mono",monospace;font-weight:500}
.table-now .by{margin-left:auto;font-size:11.5px;color:var(--muted)}

/* 记牌网格 */
.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-top:12px}
.tile{background:var(--surface);border:1px solid var(--line-soft);border-radius:11px;
  padding:9px clamp(4px, 1.7vw, 7px) 8px;
  display:flex;flex-direction:column;align-items:stretch;gap:6px;text-align:left;
  transition:transform .08s, background .15s, border-color .15s;
  user-select:none;position:relative;overflow:hidden}
.tile:active{transform:scale(.95)}
/* 点数是主角：先找到是哪张牌，再读旁边的剩余张数 */
/* 字号跟着屏宽缩，窄机上「10」「小王」才不会顶出格子 */
.tile .row{display:flex;align-items:baseline;justify-content:space-between;gap:3px;
  min-width:0;white-space:nowrap;overflow:hidden}
.tile .rk{font-family:"IBM Plex Mono",monospace;font-size:clamp(18px, 6.2vw, 26px);
  font-weight:600;line-height:1;letter-spacing:-.05em}
.tile .lf{font-family:"IBM Plex Mono",monospace;font-size:clamp(12px, 3.7vw, 15px);
  font-weight:500;line-height:1;color:var(--muted);letter-spacing:-.02em;flex:0 0 auto}
.tile .mine{font-size:10px;color:var(--faint);line-height:1;height:11px}
.tile .mine b{color:var(--jade);font-weight:600}
.pips{display:flex;gap:2px;height:4px}
.pip{flex:1 1 0;max-width:7px;height:4px;border-radius:2px;background:var(--line)}
.pip.on{background:var(--text)}
.tile.lvl{border-color:var(--gold);background:var(--gold-soft)}
.tile.lvl .rk{color:var(--gold)}
.tile.lvl .lf{color:color-mix(in srgb, var(--gold) 80%, transparent)}
.tile.lvl .pip.on{background:var(--gold)}
.tile.joker .rk{font-family:"Noto Sans SC",sans-serif;font-size:clamp(13px, 4.1vw, 16px);
  font-weight:700;letter-spacing:0;color:var(--red)}
/* 「小王」「大王」两个汉字比数字宽，只有窄屏放不下时才改成上下叠 */
@media (max-width:400px){
  .tile.joker .row{flex-direction:column;align-items:flex-start;gap:3px}
}
.tile.joker .pip.on{background:var(--red)}
.tile.empty{opacity:.32}
/* 别家一张都没有了，而我手上还有 —— 这几张就是绝对大牌 */
.tile.owned{border-color:var(--jade);background:var(--jade-soft)}
.tile.owned .lf{color:var(--jade)}
.tile.sel{border-color:var(--red);box-shadow:inset 0 0 0 2px var(--red)}
.tile .badge{position:absolute;top:3px;right:4px;font-family:"IBM Plex Mono",monospace;font-size:10px;
  color:var(--red);font-weight:600}
@media (prefers-reduced-motion:reduce){.tile{transition:none}}

.pendbar{margin-top:11px;padding:10px 11px;border-radius:9px;border:1px dashed var(--line);background:var(--surface-2)}
.pendbar .lab{font-size:11px;letter-spacing:.12em;color:var(--faint)}
.pendbar .val{font-family:"IBM Plex Mono",monospace;font-size:15px;margin-top:3px}
.pendbar .val em{font-style:normal;color:var(--faint)}
.pendbar .kind{font-size:12px;color:var(--jade);margin-top:2px}
.pendbar .kind.bad{color:var(--red)}

.readout{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line-soft);
  border:1px solid var(--line-soft);border-radius:9px;overflow:hidden}
.readout.r4{grid-template-columns:repeat(4,1fr)}
.readout.r4 .v{font-size:23px}
.readout .v.gold{color:var(--gold)}
/* 值得花点击的就那几张，其余弱化但仍可点 */
.grid.lite .tile:not(.key){opacity:.56}
.grid.lite .tile:not(.key).sel{opacity:1}
.readout div{background:var(--surface);padding:9px 8px;text-align:center}
.readout .k{font-size:10.5px;color:var(--faint);letter-spacing:.08em;line-height:1.4}
.readout .v{font-family:"IBM Plex Mono",monospace;font-size:19px;font-weight:500;line-height:1.25}
.readout .v.red{color:var(--red)}
.readout .v.jade{color:var(--jade)}

.alertline{display:flex;gap:8px;align-items:flex-start;margin-top:10px;padding:9px 11px;border-radius:8px;
  background:var(--red-soft);border:1px solid color-mix(in srgb,var(--red) 30%, transparent);font-size:12.5px;line-height:1.55}
.alertline.calm{background:var(--jade-soft);border-color:color-mix(in srgb,var(--jade) 28%, transparent)}
.alertline .ic{color:var(--red);font-weight:700;line-height:1.5}
.alertline.calm .ic{color:var(--jade)}
.stale{border:1px solid var(--gold);background:var(--gold-soft);border-radius:10px;
  padding:12px 13px;margin-bottom:12px;display:flex;flex-direction:column;gap:9px}
.stale .t{font-size:13.5px;line-height:1.6}
.stale .t b{color:var(--gold)}

.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);border-radius:7px;padding:4px 9px;font-size:12.5px;
  display:inline-flex;align-items:center;gap:6px;background:var(--surface)}
.chip .n{font-family:"IBM Plex Mono",monospace;color:var(--faint);font-size:11.5px}
.chip.bomb{border-color:var(--red);background:var(--red-soft);color:var(--red);font-weight:500}
.chip.wild{border-color:var(--gold);background:var(--gold-soft);color:var(--gold)}
.chip.seq{border-color:var(--jade);color:var(--jade);background:var(--jade-soft)}
.emptyhint{text-align:center;color:var(--faint);font-size:13px;padding:22px 10px;line-height:1.7}

.adv{border:1px solid var(--line-soft);border-radius:9px;padding:11px 12px;background:var(--surface-2);margin-bottom:7px}
.adv.first{border-color:var(--jade);background:var(--jade-soft)}
.adv.first.pass{border-color:var(--gold);background:var(--gold-soft)}
.adv.first.blast{border-color:var(--red);background:var(--red-soft)}
.adv-head{display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.badge{font-size:11px;letter-spacing:.1em;padding:2px 8px;border-radius:5px;border:1px solid var(--line);
  color:var(--muted);background:var(--surface);flex:0 0 auto}
.adv.first .badge{border-color:var(--jade);color:var(--jade);font-weight:600}
.adv.first.pass .badge{border-color:var(--gold);color:var(--gold)}
.adv.first.blast .badge{border-color:var(--red);color:var(--red)}
.adv-play{font-family:"IBM Plex Mono",monospace;font-size:15.5px;font-weight:500}
.adv-h{margin-left:auto;font-family:"IBM Plex Mono",monospace;font-size:11.5px;color:var(--muted);flex:0 0 auto}
.adv-why{font-size:12.5px;color:var(--muted);margin-top:5px;line-height:1.6}
.adv.first .adv-why{color:var(--text)}

.field{display:flex;flex-direction:column;gap:6px;margin-bottom:10px}
.field label{font-size:11px;letter-spacing:.12em;color:var(--faint)}
select{font:inherit;font-size:14px;background:var(--surface);color:var(--text);
  border:1px solid var(--line);border-radius:8px;padding:8px 10px;width:100%}

.knows{display:flex;flex-direction:column;gap:5px}
.know{display:flex;gap:9px;align-items:baseline;font-size:12.5px}
.know .who{flex:0 0 34px;color:var(--muted)}
.know .txt{font-family:"IBM Plex Mono",monospace;font-size:12px}

/* 计分器 */
.teams{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:stretch}
.team{border:1px solid var(--line-soft);border-radius:10px;padding:12px 10px;text-align:center;background:var(--surface);position:relative}
.team.act{border-color:var(--gold);box-shadow:inset 0 0 0 1px var(--gold)}
.team input{border:none;background:none;text-align:center;width:100%;padding:0;font-size:13px;color:var(--muted);border-bottom:1px dashed transparent}
.team input:focus{outline:none;border-bottom-color:var(--line)}
.pcard{width:clamp(78px, 25vw, 104px);aspect-ratio:5/7;margin:11px auto 4px;
  position:relative;border-radius:9px;
  background:var(--face);border:1px solid var(--face-line);
  box-shadow:0 2px 4px rgba(0,0,0,.20), 0 10px 22px -12px rgba(0,0,0,.55)}
.pcard .big{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  font-family:"IBM Plex Mono",monospace;font-size:clamp(42px, 13.5vw, 56px);
  font-weight:600;letter-spacing:-.05em}
/* 角标＝点数在上、花色在下，用 flex 纵向排。
   之前是用 calc 手算花色的偏移，手机上只剩 2px 间隙，iOS 字体度量一变就压上了 */
.pcard .corner{position:absolute;display:flex;flex-direction:column;align-items:center;
  gap:.12em;line-height:1;
  font-family:"IBM Plex Mono",ui-monospace,"Segoe UI Symbol",serif;
  font-variant-emoji:text}                       /* 别把花色画成 emoji */
.pcard .corner.tl{top:6.5%;left:7%}
.pcard .corner.br{bottom:6.5%;right:7%;transform:rotate(180deg)}
.pcard .corner .rk{font-size:clamp(13px, 4vw, 17px);font-weight:600}
.pcard .corner .su{font-size:clamp(11px, 3.4vw, 14px);opacity:.92}
.team.a .pcard{color:var(--card-red)}
.team.b .pcard{color:var(--card-jade)}
.tries{display:flex;gap:3px;justify-content:center;margin-top:5px;height:6px}
.tries i{width:6px;height:6px;border-radius:50%;border:1px solid var(--gold)}
.tries i.used{background:var(--gold)}
.vs{display:flex;align-items:center;font-size:11px;color:var(--faint);letter-spacing:.1em}
.crown{position:absolute;top:-9px;left:50%;transform:translateX(-50%);font-size:10px;letter-spacing:.1em;
  background:var(--gold);color:var(--surface);padding:1px 8px;border-radius:999px;white-space:nowrap}
.logline{display:flex;gap:9px;align-items:baseline;padding:7px 0;border-bottom:1px solid var(--line-soft);font-size:13px}
.logline:last-child{border-bottom:none}
.logline .no{font-family:"IBM Plex Mono",monospace;font-size:11px;color:var(--faint);flex:0 0 26px}

ol.tips{margin:0;padding-left:1.15em;display:flex;flex-direction:column;gap:9px;font-size:13.5px;line-height:1.65}

<div class="shell">
  <header class="top">
    <div class="brandrow">
      <div>
        <div class="brand">掼蛋<span class="dot">·</span>牌桌助手</div>
        <div class="brand-sub mono">JI PAI / CHU PAI / JI FEN</div>
      </div>
      <button class="lvlchip" id="lvlBtn" aria-expanded="false">
        <span class="lab">本局打</span><span class="val" id="lvlVal">2</span>
      </button>
    </div>
    <div class="lvlpick" id="lvlPick"></div>
  </header>

  <section class="panel" id="p-track">
    <p class="tiny"><button id="toScore">‹ 回到计分器</button></p>
    <div id="staleBar"></div>
    <div class="card" id="bigBoard">
      <h3>别家手上还有</h3>
      <div class="readout r4" id="bigCells"></div>
      <p class="note" id="bigNote"></p>
    </div>

    <div class="card">
      <p class="note" id="modeNote" style="margin-top:0"></p>
      <div class="grid" id="grid"></div>
      <div class="btnrow" id="trackBtns" style="margin-top:11px"></div>
    </div>

    <h2 class="sec">场面</h2>
    <div class="card">
      <div id="alerts"></div>
    </div>

    <div class="card" id="knowCard" hidden>
      <h3 id="knowTitle">这一局已经知道的</h3>
      <div class="knows" id="knows"></div>
      <p class="note" id="knowNote"></p>
    </div>
  </section>

  <section class="panel on" id="p-score">
    <div id="winBox"></div>
    <div class="card" id="teamsCard">
      <div class="teams">
        <div class="team a" id="teamA">
          <div class="crown" id="crownA" hidden>本局打这级</div>
          <input id="nameA" maxlength="6" aria-label="我方队名">
          <div class="pcard" id="lvA"></div>
          <div class="tries" id="triesA"></div>
        </div>
        <div class="vs">VS</div>
        <div class="team b" id="teamB">
          <div class="crown" id="crownB" hidden>本局打这级</div>
          <input id="nameB" maxlength="6" aria-label="对方队名">
          <div class="pcard" id="lvB"></div>
          <div class="tries" id="triesB"></div>
        </div>
      </div>
    </div>

    <h2 class="sec">记本局</h2>
    <div class="card">
      <h3>谁拿了头游</h3>
      <div class="seg s4" id="winSeg"></div>
      <h3 style="margin-top:14px">头游的对家排第几</h3>
      <div class="btnrow" style="display:grid;grid-template-columns:repeat(3,1fr)">
        <button class="btn" data-up="3">二游 · 双下<br><span class="mono" style="font-size:12px;color:var(--muted)">升 3 级</span></button>
        <button class="btn" data-up="2">三游<br><span class="mono" style="font-size:12px;color:var(--muted)">升 2 级</span></button>
        <button class="btn" data-up="1">四游<br><span class="mono" style="font-size:12px;color:var(--muted)">升 1 级</span></button>
      </div>
    </div>

    <h2 class="sec">进贡</h2>
    <div class="card" id="tributeCard"></div>

    <h2 class="sec">牌局记录</h2>
    <div class="card">
      <div id="logBox"></div>
      <div class="btnrow" style="margin-top:12px">
        <button class="btn ghost" id="undoRound">撤销上一局</button>
        <button class="btn ghost" id="newMatch">比分归零 · 重开一场</button>
      </div>
      <h3 style="margin-top:14px">过 A 要打成什么样</h3>
      <div class="seg s4" id="aRuleSeg">
        <button data-a="1">头游即可</button>
        <button data-a="2">头游 + 三游以上</button>
        <button data-a="3">必须双下</button>
      </div>
      <p class="note" id="aRuleNote"></p>
      <h3 style="margin-top:14px">下一局谁发牌</h3>
      <div class="seg s4" id="dealSeg">
        <button data-d="last">末游发牌</button>
        <button data-d="first">头游发牌</button>
        <button data-d="rotate">轮流发牌</button>
      </div>
      <p class="note" id="dealNote"></p>
    </div>
    <p class="tiny"><button id="toTrack">记牌器 · 只记 20 张大牌 ›</button></p>
  </section>

  <div class="foot">数据存在这台设备的浏览器里，关掉页面也在。</div>
</div>

<script>
"use strict";
/* ==========================================================
   牌面模型：两副牌 108 张
   ========================================================== */
const RANKS = [{k:'2',v:2},{k:'3',v:3},{k:'4',v:4},{k:'5',v:5},{k:'6',v:6},{k:'7',v:7},
  {k:'8',v:8},{k:'9',v:9},{k:'10',v:10},{k:'J',v:11},{k:'Q',v:12},{k:'K',v:13},{k:'A',v:14}];
const JOKERS = [{k:'SJ',v:16,label:'小王'},{k:'BJ',v:17,label:'大王'}];
const ALL = [...RANKS, ...JOKERS];
const TOTAL = k => (k==='SJ'||k==='BJ') ? 2 : 8;
const LABEL = k => k==='SJ' ? '小王' : k==='BJ' ? '大王' : k;
const byVal = {}; ALL.forEach(r=>byVal[r.v]=r.k);
const rankStr = v => byVal[v] || String(v);

/* 座位：出牌顺序 我 → 下家 → 对家 → 上家 */
const SEATS = ['我','下家','对家','上家'];

const LS = 'guandan-assist-v2';
const S = {
  level:2, tab:'score',
  seen:{}, trace:[],
  teams:{a:{name:'我方',lv:2,tries:0}, b:{name:'对方',lv:2,tries:0}},
  playing:'a', winner:null, log:[], pickFirst:0, trackedAt:0, aRule:2, dealRule:'last'
};
ALL.forEach(r=>{ S.seen[r.k]=0; });

const $ = s => document.querySelector(s);
const el = (t,c,txt)=>{ const n=document.createElement(t); if(c)n.className=c; if(txt!=null)n.textContent=txt; return n; };
function save(){ try{ localStorage.setItem(LS, JSON.stringify(S)); }catch(e){} }
function load(){
  try{
    const d = JSON.parse(localStorage.getItem(LS)||'null'); if(!d) return;
    Object.assign(S, d);
    ALL.forEach(r=>{ S.seen[r.k]=S.seen[r.k]||0; });
  }catch(e){}
}

/* ==========================================================
   记牌器
   ========================================================== */
/* 值得花点击的点数：级牌、A、大小王 —— 一副牌里总共 20 张 */
const HOWTO = '<b>格子上的数字 ＝ 这门牌还有几张在别家手里。</b>'
  + '<br><br>① <b>开局</b>：把你自己手上的大牌点掉'
  + '<br>② <b>打牌时</b>：<b>别人</b>打出一张大牌，就点一下'
  + '<br>③ <b>你自己出牌不用点</b> —— 开局已经算过了，再点会重复'
  + '<br><br>同一张牌只点一次。点错了用「撤销上一步」。';
const isKey = k => k==='SJ' || k==='BJ' || k==='A' || (RANKS.find(r=>r.k===k)||{}).v===S.level;

function tapTile(k){                 // 只有一个动作：这张牌不在别家手里了
  if(S.seen[k] >= TOTAL(k)) return;
  S.seen[k]++; S.trace.push(k);
  renderAll(); save();
}
function undoStep(){
  const k = S.trace.pop(); if(!k) return;
  S.seen[k]--; renderAll(); save();
}
function renderGrid(){
  const g = $('#grid'); g.innerHTML='';
  g.className = 'grid lite';
  ALL.forEach(r=>{
    const t=TOTAL(r.k), left=t-S.seen[r.k];
    const b = el('button','tile'+(r.v===S.level?' lvl':'')+((r.k==='SJ'||r.k==='BJ')?' joker':'')
      +(left===0?' owned':'')+(isKey(r.k)?' key':''));
    const row=el('div','row');
    row.appendChild(el('span','rk',LABEL(r.k)));
    row.appendChild(el('span','lf',String(left)));
    b.appendChild(row);
    const pips=el('div','pips');
    for(let i=0;i<t;i++) pips.appendChild(el('i','pip'+(i<left?' on':'')));
    b.appendChild(pips);
    b.onclick = ()=> tapTile(r.k);
    g.appendChild(b);
  });
}
function renderButtons(){
  const btns = $('#trackBtns'); btns.innerHTML='';
  const b1=el('button','btn ghost','撤销上一步'); b1.onclick=undoStep;
  const b2=el('button','btn','清空记牌 · 开下一局'); b2.onclick=resetRound;
  btns.append(b1,b2);
}
function resetRound(){
  if(!confirm('清空这一局的记牌，开始记下一局？\n\n比分和等级不受影响。')) return;
  clearTrack();
}
/* 大牌看板：只有这 20 张牌值得你抬手 */
function renderBigBoard(){
  const cells = $('#bigCells'); cells.innerHTML='';
  const keys = [['BJ','大王'],['SJ','小王'],[byVal[S.level],'级牌 '+rankStr(S.level)],['A','A']];
  keys.forEach(([k,label])=>{
    const left = Math.max(0, TOTAL(k)-S.seen[k]);
    const d = el('div');
    d.appendChild(el('div','k',label));
    const v = el('div','v'+(left===0?' jade':''));   // 归零＝好消息，别家没有了
    v.textContent = left;
    d.appendChild(v);
    cells.appendChild(d);
  });
  const gone = 20 - keys.reduce((a,[k])=>a+Math.max(0,TOTAL(k)-S.seen[k]),0);
  $('#bigNote').innerHTML = gone===0
    ? '真正影响决策的只有这 20 张：级牌 8、A 8、大小王 4。'
    : '已有 '+gone+'/20 张不在别家手里。<b>归零＝这门牌你随便走</b>。';
}
function renderReadout(){
  const box=$('#alerts'); box.innerHTML='';
  const line=(ic,html)=>{ const d=el('div','alertline calm'); d.appendChild(el('span','ic',ic));
    const sp=el('span'); sp.innerHTML=html; d.appendChild(sp); box.appendChild(d); };
  const clear = [['BJ','大王'],['SJ','小王'],[byVal[S.level],'级牌'],['A','A']]
    .filter(([k])=> TOTAL(k)-S.seen[k]<=0).map(([,n])=>n);
  if(clear.length) line('✓','别家手上<b>没有 '+clear.join('、')+'</b> 了。');
  if(S.seen.SJ+S.seen.BJ===4) line('✓','四张王全部现身，<b>天王炸已排除</b>。');
  if(clear.length>=3) line('✓','大牌基本走空，<b>你手上的大牌可以放心领牌了</b>。');
  if(!box.children.length) line('·','别人打出大牌就点一张，这里会告诉你什么时候可以放心走牌。');
}
function renderKnows(){
  const intel = tributeIntel();
  const card=$('#knowCard'), box=$('#knows'); box.innerHTML='';
  card.hidden = intel.length===0;
  if(card.hidden) return;
  intel.forEach((x,i)=>{
    const d = el('div','alertline'+(x.ico==='贡'?' calm':''));
    if(i) d.style.marginTop='8px';
    d.appendChild(el('span','ic', x.ico));
    const sp = el('span'); sp.innerHTML = x.txt; d.appendChild(sp);
    box.appendChild(d);
  });
  $('#knowNote').textContent = '依据：贡的必须是除红桃级牌外最大的一张。有人不按规矩进小牌，这条就不作数。';
}

/* ==========================================================
   计分器
   ========================================================== */
const DEAL_NOTE = {
  last:'下一局由上一局的末游洗牌发牌（输家发牌）。',
  first:'下一局由上一局的头游洗牌发牌。',
  rotate:'发牌按座位轮流，每局往下家挪一位。'
};
const A_RULE_NOTE = {
  1:'打 A 时只要拿到头游就算过 A（对家名次不限）。',
  2:'打 A 时要头游、且对家至少是三游（升 2 级或双下）才算过 A —— 靠「头游+四游」的 +1 级不算。',
  3:'打 A 时必须双下（头游+二游）才算过 A。'
};
const LVNAME = v => byVal[v] || String(v);
const LVVAL  = s => { const r=RANKS.find(x=>x.k===s); return r?r.v:2; };
function renderScore(){
  const A=S.teams.a, B=S.teams.b;
  $('#nameA').value=A.name; $('#nameB').value=B.name;
  const corner = (n,suit,pos) =>
    '<span class="corner '+pos+'"><span class="rk">'+n+'</span><span class="su">'+suit+'</span></span>';
  const face = (v,suit) => { const n=LVNAME(v);
    return corner(n,suit,'tl') + '<span class="big">'+n+'</span>' + corner(n,suit,'br'); };
  $('#lvA').innerHTML = face(A.lv,'\u2665\uFE0E');   // FE0E = 强制文字字形，否则 iOS 会渲染成彩色 emoji
  $('#lvB').innerHTML = face(B.lv,'\u2660\uFE0E');
  $('#teamA').classList.toggle('act', S.playing==='a');
  $('#teamB').classList.toggle('act', S.playing==='b');
  $('#crownA').hidden = S.playing!=='a'; $('#crownB').hidden = S.playing!=='b';
  ['a','b'].forEach(t=>{ const box=$('#tries'+t.toUpperCase()); box.innerHTML='';
    if(S.teams[t].lv===14) for(let i=0;i<3;i++){ const d=el('i'); if(i<S.teams[t].tries)d.classList.add('used'); box.appendChild(d); } });
  const ws=$('#winSeg'); ws.innerHTML='';
  SEATS.forEach((n,i)=>{
    const b=el('button',null,i===0?'我':n);
    b.setAttribute('aria-pressed', (S.pickFirst||0)===i);
    b.onclick=()=>{ S.pickFirst=i; renderAll(); save(); };
    ws.appendChild(b);
  });
  document.querySelectorAll('#aRuleSeg button').forEach(b=>
    b.setAttribute('aria-pressed', String(S.aRule||2)===b.dataset.a));
  document.querySelectorAll('#dealSeg button').forEach(b=>
    b.setAttribute('aria-pressed', (S.dealRule||'last')===b.dataset.d));
  $('#dealNote').textContent = DEAL_NOTE[S.dealRule||'last']
    + '　掼蛋各地规矩不同，按你们桌上的来。';
  $('#aRuleNote').textContent = A_RULE_NOTE[S.aRule||2]
    + '　三次未过退回打 2。升级不越 A。';
  const wb=$('#winBox'); wb.innerHTML='';
  if(S.winner){
    const d=el('div','win');
    d.appendChild(el('div','t', S.teams[S.winner].name+' 过 A，赢了'));
    d.appendChild(el('div','','共 '+S.log.length+' 局'));
    const b=el('button','btn wide','再来一场'); b.style.marginTop='10px'; b.onclick=newMatch;
    d.appendChild(b); wb.appendChild(d);
  }
  const lb=$('#logBox'); lb.innerHTML='';
  if(!S.log.length) lb.appendChild(el('div','emptyhint','还没有记录。打完一局，在上面点一下就行。'));
  else S.log.slice().reverse().forEach((r,i)=>{
    const d=el('div','logline');
    d.appendChild(el('span','no mono','#'+(S.log.length-i)));
    d.appendChild(el('span','who '+r.w, S.teams[r.w].name));
    d.appendChild(el('span','', r.up===3?'双下':r.up===2?'头游+三游':'头游+四游'));
    d.appendChild(el('span','up mono', r.from+' → '+r.to));
    lb.appendChild(d);
  });
}
/* ---------- 进贡助手 ----------
   进贡：末游把「除红桃级牌外最大的一张」给头游
   双下：三游和四游都进贡，头游先挑大的那张，二游拿剩下的
   还贡：收贡方还一张 10 或以下的牌
   抗贡：进贡方手握两张大王可以不进（双下时两家合计两大王也算）
   先出：进贡方先出牌；抗贡成立则头游先出                              */
const LVKEY = () => byVal[S.level];
const TRIB_CARDS = [['BJ','大王'],['SJ','小王'],['__LV__','级牌'],['A','A'],['K','K'],['Q','Q'],['low','更小']];
const tribStrength = k => k==='BJ'?17 : k==='SJ'?16 : k==='__LV__'?15
  : k==='A'?14 : k==='K'?13 : k==='Q'?12 : 11;
const tribName = k => k==='__LV__' ? '级牌 '+rankStr(S.level)
  : k==='low' ? 'Q 以下的牌' : (k==='BJ'?'大王':k==='SJ'?'小王':k);

/* 进贡透露了什么 —— 贡牌是「除红桃级牌外最大的一张」，
   所以它既告诉你收贡方多了什么，也框死了进贡方手里的上限 */
/* 下一局谁发牌 —— 规矩各地不同，做成可选 */
function dealerSeat(r, plan){
  const rule = S.dealRule || 'last';
  if(rule === 'first')  return plan.first;
  if(rule === 'rotate') return S.log.length % 4;        // 每局往下家挪一位
  if(plan.kind === 'double') return r.last;             // 双下分不出末游，得问
  return r.up===1 ? plan.mate : (r.last!=null ? r.last : plan.from[0]);
}

function tributeIntel(){
  const out = [];
  const r = S.log[S.log.length-1];
  const plan = r && tributePlan(r);
  if(!plan || plan.kind==='ask-last') return out;
  const nm = i => i===0 ? '你' : SEATS[i];

  if(r.kang){
    out.push({ico:'!', txt: plan.kind==='double'
      ? '<b>'+plan.from.map(nm).join(' 和 ')+'</b> 合计手握<b>两张大王</b>（抗贡）—— 全场就这两张，其他人一张都没有。'
      : '<b>'+nm(plan.from[0])+'</b> 手握<b>两张大王</b>（抗贡）—— 全场就这两张，其他人一张都没有。'});
    return out;
  }
  const done = (r.tribs||[]).filter(t=>t.card);
  if(!done.length) return out;

  // 双下时头游先挑大的，据此算出两张贡牌各自去了谁手上
  let dest = {};
  if(plan.kind==='double' && done.length===2){
    const [a,c] = done;
    const aBig = tribStrength(a.card) >= tribStrength(c.card);
    dest[a.from] = aBig ? plan.first : plan.mate;
    dest[c.from] = aBig ? plan.mate : plan.first;
  } else {
    done.forEach(t=> dest[t.from] = plan.first);
  }

  done.forEach(t=>{
    const to = dest[t.from];
    out.push({ico:'贡', txt:'<b>'+nm(to)+'</b> 手上多了一张 <b>'+tribName(t.card)+'</b>（'+nm(t.from)+'进的）。'});
    if(t.card==='low'){
      out.push({ico:'!', txt:'<b>'+nm(t.from)+'</b> 手上<b>没有 Q 以上的牌</b>了。'});
    } else if(t.card==='BJ'){
      // 没有牌比大王更大，说"没有更大的"是废话；这里真正的推断是他大王已经出空
      out.push({ico:'!', txt:'<b>'+nm(t.from)+'</b> 交出了大王而<b>没有抗贡</b>，说明他原本只有这一张 —— '
        +'现在他<b>一张大王都没有</b>了。'});
    } else if(t.card==='SJ'){
      out.push({ico:'!', txt:'<b>'+nm(t.from)+'</b> 手上<b>没有大王</b>了（有的话得先进大王）。'});
    } else {
      out.push({ico:'!', txt:'<b>'+nm(t.from)+'</b> 手上<b>没有比 '+tribName(t.card)+' 更大的牌</b>了'
        +'（红桃'+rankStr(S.level)+'除外）—— 贡的必须是他最大的一张。'});
    }
  });
  return out;
}

function tributePlan(r){
  if(!r || r.first==null) return null;
  const first = r.first, mate = (first+2)%4;
  if(r.up===3) return {kind:'double', first, mate,
    from:[0,1,2,3].filter(i=> i!==first && i!==mate)};
  const last = r.up===1 ? mate : r.last;          // 头游+四游 时末游必是头游的对家
  if(last==null) return {kind:'ask-last', first, mate,
    options:[0,1,2,3].filter(i=> i!==first && i!==mate)};
  return {kind:'single', first, mate, from:[last]};
}
function isStale(){
  if(S.log.length === (S.trackedAt||0)) return false;
  return ALL.some(r=> S.seen[r.k] > 0);
}
function clearTrack(){
  ALL.forEach(r=> S.seen[r.k]=0);
  S.trace=[]; S.trackedAt = S.log.length;
  renderAll(); save();
}
function renderStale(){
  const bar = $('#staleBar'); bar.innerHTML='';
  if(!isStale()) return;
  const d = el('div','stale');
  const t = el('div','t');
  t.innerHTML = '记牌器里还是<b>上一局</b>的数据，本局已经改打 <b>'+rankStr(S.level)
    +'</b> 了。不清空的话，看板上的数字是上一局的，会让你误判。';
  d.appendChild(t);
  const btn = el('button','btn gold wide','清空，开始记这一局');
  btn.onclick = clearTrack;
  d.appendChild(btn);
  bar.appendChild(d);
}
function renderTribute(){
  const card = $('#tributeCard'); card.innerHTML='';
  const r = S.log[S.log.length-1];
  const plan = tributePlan(r);
  if(!plan){
    card.appendChild(el('div','emptyhint',
      '记完一局之后，这里会算出谁给谁进贡、进什么牌、能不能抗贡，\n以及贡完之后谁先出牌。'));
    return;
  }
  const box = el('div','trib');
  const nm = i => i===0 ? '你' : SEATS[i];
  if(isStale()){
    const w = el('div','stale');
    const t = el('div','t');
    t.innerHTML = '记贡牌之前先清一下 —— 记牌器里还是上一局的数据。';
    w.appendChild(t);
    const bb = el('button','btn gold wide','清空记牌器，开始新一局');
    bb.onclick = clearTrack; w.appendChild(bb);
    box.appendChild(w);
  }
  const lvName = rankStr(S.level);

  if(plan.kind==='ask-last'){
    box.appendChild(el('div','trow')).innerHTML =
      '<span class="lab">还差一步</span><span>这一局<b>谁是末游</b>？知道了才能算进贡。</span>';
    const seg = el('div','gift');
    plan.options.forEach(i=>{
      const b = el('button',null, SEATS[i]);
      b.onclick = ()=>{ r.last = i; renderAll(); save(); };
      seg.appendChild(b);
    });
    box.appendChild(seg);
    card.appendChild(box);
    return;
  }

  /* 抗贡开关 */
  const kangWho = plan.kind==='double' ? '两家合计' : nm(plan.from[0]);
  if(r.kang){
    const d = el('div','flow'+(plan.from.indexOf(0)>=0?' me':''));
    d.appendChild(el('span','who','抗贡成立'));
    d.appendChild(el('span','what','不进不还，'+nm(plan.first)+'（头游）先出牌'));
    box.appendChild(d);
  } else {
    plan.from.forEach(f=>{
      const d = el('div','flow'+(f===0||plan.first===0?' me':''));
      d.appendChild(el('span','who', nm(f)));
      d.appendChild(el('span','arrow','→'));
      d.appendChild(el('span','who', plan.kind==='double' ? nm(plan.first)+'、'+nm(plan.mate) : nm(plan.first)));
      d.appendChild(el('span','what', f===0?'你要进贡':'他要进贡'));
      box.appendChild(d);
    });
    const row=(lab,html)=>{ const d=el('div','trow');
      d.appendChild(el('span','lab',lab)); const s=el('span'); s.innerHTML=html; d.appendChild(s); box.appendChild(d); };
    row('进什么','手上<b>除红桃'+lvName+'（逢人配）之外最大的一张</b>。其它花色的 '+lvName+' 照进不误。');
    if(plan.kind==='double')
      row('谁先挑','<b>'+nm(plan.first)+'</b> 先挑大的，剩下那张给 '+nm(plan.mate)+'。');
    row('还什么', plan.kind==='double'
      ? '<b>'+nm(plan.first)+'</b> 和 <b>'+nm(plan.mate)+'</b> 各还一张 <b>10 或以下</b> 给进贡方。'
      : '<b>'+nm(plan.first)+'</b> 还一张 <b>10 或以下</b> 给 <b>'+nm(plan.from[0])+'</b>。');
    /* 记下进的是哪张 —— 这是全局信息量最大的一步：
       贡牌是「除红桃级牌外最大的一张」，所以它同时框死了进贡方手里的上限 */
    r.tribs = r.tribs || [];
    plan.from.forEach(f=>{
      if(!r.tribs.some(x=>x.from===f)) r.tribs.push({from:f, card:null});
    });
    plan.from.forEach(f=>{
      const rec = r.tribs.find(x=>x.from===f);
      const d = el('div','trow');
      d.appendChild(el('span','lab', plan.kind==='double' ? nm(f).slice(0,3) : '进的是'));
      const g = el('div','gift');
      TRIB_CARDS.forEach(([k,label])=>{
        const bb = el('button', rec.card===k ? 'on' : null, k==='__LV__' ? '级牌 '+lvName : label);
        bb.onclick = ()=>{ rec.card = (rec.card===k ? null : k); renderAll(); save(); };
        g.appendChild(bb);
      });
      d.appendChild(g);
      box.appendChild(d);
    });
    row('先出牌', plan.kind==='double'
      ? '<b>两位进贡方先出</b>。'
      : '<b>'+nm(plan.from[0])+' 先出</b>。');
  }

  /* 记完贡牌，当场把推断显示出来 */
  const intel = tributeIntel();
  intel.forEach(x=>{
    const d = el('div','alertline'+(x.ico==='贡'?' calm':''));
    d.appendChild(el('span','ic', x.ico));
    const sp = el('span'); sp.innerHTML = x.txt; d.appendChild(sp);
    box.appendChild(d);
  });

  /* 抗贡按钮 */
  const kb = el('button','btn wide'+(r.kang?' jade':''),
    r.kang ? '取消抗贡' : '『'+kangWho+'有两张大王』→ 抗贡');
  kb.onclick = ()=>{ r.kang = !r.kang; renderAll(); save(); };
  box.appendChild(kb);

  /* 记牌提示：贡牌不需要单独记，登记手牌的时机对了就自动算对
     seen 的含义是「不在别家手里的牌」：
       贡进来的 → 在我手里 → 登记手牌时已计入
       贡出去的 → 进了对手手里 → 本来就该算在别家手里
       对手之间互贡 → 牌仍在别家手里 → 也不该计入
     所以只要贡完再登记，三种情况全部自动正确。*/

  /* 下一局谁发牌 */
  const dl = el('div','trow');
  dl.appendChild(el('span','lab','发牌'));
  const dsp = el('span');
  const who = dealerSeat(r, plan);
  if(who == null){                                      // 只有「末游发牌 + 双下」这一种情况需要问
    dsp.innerHTML = '下一局由<b>末游</b>发牌。双下的两家里，谁是末游？';
    dl.appendChild(dsp);
    const g = el('div','gift');
    plan.from.forEach(i=>{ const bb=el('button',null,SEATS[i]);
      bb.onclick=()=>{ r.last=i; renderAll(); save(); }; g.appendChild(bb); });
    dl.appendChild(g);
  } else {
    const tag = S.dealRule==='first' ? '头游' : S.dealRule==='rotate' ? '轮到他' : '末游';
    dsp.innerHTML = '下一局由 <b>'+(who===0?'你':SEATS[who])+'</b>（'+tag+'）洗牌发牌。';
    dl.appendChild(dsp);
  }
  box.appendChild(dl);

  card.appendChild(box);
}
const snapshot = () => ({a:{...S.teams.a}, b:{...S.teams.b}, playing:S.playing, level:S.level, winner:S.winner});
function record(up){
  if(S.winner) return;
  const seat=S.pickFirst||0, w = seat%2===0 ? 'a' : 'b';
  const t=S.teams[w], from=LVNAME(t.lv);
  const atA = t.lv===14 && S.playing===w, prev=snapshot();
  const need = S.aRule || 2;                       // 过 A 需要升几级
  if(atA){
    if(up >= need){                                // 达标 → 过 A
      S.winner=w; S.log.push({w,up,from,to:'胜',prev,first:seat});
      renderAll(); save(); return;
    }
    // 拿了头游但没到门槛：不算过 A，消耗一次打 A 机会，继续打 A
    t.tries++;
    let to2 = 'A·未过';
    if(t.tries>=3){ t.lv=2; t.tries=0; to2='退回 2'; }
    S.playing=w; S.level=t.lv;
    S.log.push({w,up,from,to:to2,prev,first:seat,last:null,kang:false,tribs:[]});
    renderAll(); save(); return;
  }
  const other = w==='a'?'b':'a';
  if(S.teams[other].lv===14 && S.playing===other){
    S.teams[other].tries++;
    if(S.teams[other].tries>=3){ S.teams[other].lv=2; S.teams[other].tries=0; }
  }
  let to=t.lv+up; if(t.lv<14 && to>14) to=14;
  t.lv=Math.min(14,to); S.playing=w; S.level=t.lv;
  S.log.push({w,up,from,to:LVNAME(t.lv),prev,first:seat,last:null,kang:false,tribs:[]});
  renderAll(); save();
}
document.querySelectorAll('[data-up]').forEach(b=> b.onclick=()=>record(+b.dataset.up));
document.querySelectorAll('#aRuleSeg button').forEach(b=>
  b.onclick=()=>{ S.aRule=+b.dataset.a; renderAll(); save(); });
document.querySelectorAll('#dealSeg button').forEach(b=>
  b.onclick=()=>{ S.dealRule=b.dataset.d; renderAll(); save(); });
$('#nameA').oninput = e=>{ S.teams.a.name=e.target.value||'我方'; renderScore(); save(); };
$('#nameB').oninput = e=>{ S.teams.b.name=e.target.value||'对方'; renderScore(); save(); };
$('#undoRound').onclick = ()=>{
  const r=S.log.pop(); if(!r) return;
  (r.gift||[]).forEach(k=>{ if(S.seen[k]>0) S.seen[k]--; });   // 贡牌记进过看板，一并退回
  if(S.trackedAt>S.log.length) S.trackedAt=S.log.length;
  if(r.prev){ S.teams.a={...r.prev.a, name:S.teams.a.name}; S.teams.b={...r.prev.b, name:S.teams.b.name};
    S.playing=r.prev.playing; S.level=r.prev.level; S.winner=r.prev.winner; }
  else { S.winner=null; S.teams[r.w].lv=LVVAL(r.from);
    S.playing=S.log.length?S.log[S.log.length-1].w:'a'; S.level=S.teams[S.playing].lv; }
  renderAll(); save();
};
function newMatch(){
  S.teams.a.lv=2; S.teams.b.lv=2; S.teams.a.tries=0; S.teams.b.tries=0;
  S.playing='a'; S.level=2; S.winner=null; S.log=[]; S.trackedAt=0; renderAll(); save();
}
$('#newMatch').onclick = ()=>{ if(confirm('两队等级归 2、清空全部牌局记录，重开一场？\n\n记牌数据不受影响。')) newMatch(); };

/* ==========================================================
   顶部 / 切换 / boot
   ========================================================== */
function buildLevelPicker(){
  const p=$('#lvlPick'); p.innerHTML='';
  RANKS.forEach(r=>{ const b=el('button',null,r.k); b.setAttribute('aria-pressed', S.level===r.v);
    b.onclick=()=>{ S.level=r.v; DMEMO.clear(); HMEMO.clear(); renderAll(); save(); }; p.appendChild(b); });
}
$('#lvlBtn').onclick = ()=>{ const p=$('#lvlPick'); $('#lvlBtn').setAttribute('aria-expanded', p.classList.toggle('open')); };
function switchTab(t){
  S.tab = t;
  document.documentElement.dataset.view = t;      // 横屏大牌模式只在计分器页生效
  document.querySelectorAll('.panel').forEach(p=> p.classList.toggle('on', p.id==='p-'+t));
  window.scrollTo({top:0, behavior:'instant'});
  save();
}
$('#toTrack').onclick = ()=> switchTab('track');
$('#toScore').onclick = ()=> switchTab('score');

/* 把说明段落折进图标，屏幕上只留一个 ⓘ */
function hintify(){
  document.querySelectorAll('p.note').forEach(p=>{
    if(p.dataset.hinted) return;
    p.dataset.hinted = 1;
    p.hidden = true;
    p.style.marginTop = '10px';
    const btn = el('button','hint','?');
    btn.setAttribute('aria-label','说明');
    btn.setAttribute('aria-expanded','false');
    btn.onclick = ()=>{
      p.hidden = !p.hidden;
      btn.classList.toggle('on', !p.hidden);
      btn.setAttribute('aria-expanded', String(!p.hidden));
    };
    const card = p.closest('.card');
    const h3 = card && card.querySelector(':scope > h3');
    if(h3) h3.appendChild(btn);
    else if(card){ btn.classList.add('float'); card.insertBefore(btn, card.firstChild); }
  });
}

function renderAll(){
  $('#lvlVal').textContent = LVNAME(S.level);
  $('#modeNote').innerHTML = HOWTO;
  buildLevelPicker(); renderBigBoard(); renderGrid(); renderButtons();
  renderReadout(); renderKnows();
  renderScore(); renderTribute(); renderStale();
}
load();
hintify();
switchTab(S.tab==='track' ? 'track' : 'score');
renderAll();
</script>
